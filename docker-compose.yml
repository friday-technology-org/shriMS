version: '3.8'

services:
  app:
    image: ghcr.io/${GITHUB_USERNAME:-friday-technology-org}/${GITHUB_REPO:-shrims}:latest
    container_name: lara-cms-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laracms}
      - DB_USERNAME=${DB_USERNAME:-laracms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      # Make sure to set your APP_KEY in the production environment
      - APP_KEY=${APP_KEY}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lara-network

  db:
    image: mysql:8.0
    container_name: lara-cms-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laracms}
      MYSQL_USER: ${DB_USERNAME:-laracms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - lara-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - lara-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    container_name: lara-cms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - lara-redis-data:/data
    networks:
      - lara-network

networks:
  lara-network:
    driver: bridge

volumes:
  lara-db-data:
    driver: local
  lara-redis-data:
    driver: local
